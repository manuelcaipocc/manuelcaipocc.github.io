<path d="M 296.00 130.00 C 307.25 160.75, 336.00 181.00, 364 194" fill="none" stroke="#63FFF0" opacity="0.20" stroke-width="4.8" stroke-linecap="round"/><path d="M 300.18 120.50 C 308.68 162.37, 336.76 181.76, 364 194" fill="none" stroke="#4BE8E9" opacity="0.32" stroke-width="4.1" stroke-linecap="round"/><path d="M 302.77 114.61 C 309.56 163.37, 337.23 182.23, 364 194" fill="none" stroke="#32BEDF" opacity="0.44" stroke-width="3.5" stroke-linecap="round"/><path d="M 304.38 110.96 C 310.11 163.99, 337.52 182.52, 364 194" fill="none" stroke="#2896EA" opacity="0.56" stroke-width="2.8" stroke-linecap="round"/>
