<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
 <linearGradient id="m" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#6BFBE9"/><stop offset="0.45" stop-color="#29D6E9"/><stop offset="1" stop-color="#257BEC"/></linearGradient>
